<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Rounded Green Icon Box with Printer -->
  <rect x="2" y="6" width="48" height="48" rx="14" fill="#E8F8EC" stroke="#A7F3D0" stroke-width="1.5"/>
  <g transform="translate(13, 17)">
    <!-- Top Paper -->
    <path d="M7 2C7 1.44772 7.44772 1 8 1H18C18.5523 1 19 1.44772 19 2V8H7V2Z" fill="#00B32D"/>
    <!-- Printer Body -->
    <rect x="1" y="8" width="24" height="14" rx="3.5" fill="#111111"/>
    <!-- Output Tray Paper -->
    <rect x="5" y="16" width="16" height="8" rx="1.5" fill="#E8F8EC" stroke="#00B32D" stroke-width="1"/>
    <line x1="8" y1="19" x2="18" y2="19" stroke="#00B32D" stroke-width="1" stroke-linecap="round"/>
    <line x1="8" y1="21" x2="14" y2="21" stroke="#00B32D" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Wordmark Text: Easy (Black) To (Green) Print (Black) -->
  <text x="64" y="40" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#111111">Easy</tspan><tspan fill="#00B32D">To</tspan><tspan fill="#111111">Print</tspan>
  </text>
</svg>
