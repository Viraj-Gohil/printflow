<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <!-- Modern Black Printer Icon -->
  <g transform="translate(10, 9)">
    <!-- Paper Feed Top Tray -->
    <path d="M14 4C14 2.34315 15.3431 1 17 1H35C36.6569 1 38 2.34315 38 4V16H14V4Z" fill="#111111"/>
    <!-- Paper Top Sheet -->
    <rect x="17" y="4" width="18" height="12" rx="1" fill="#FFFFFF"/>
    <!-- Main Printer Body -->
    <rect x="3" y="16" width="46" height="26" rx="6" fill="#111111"/>
    <!-- Status LED (Green) -->
    <circle cx="43" cy="21" r="2" fill="#00B32D"/>
    <!-- Paper Slot Out -->
    <rect x="11" y="27" width="30" height="9" rx="1.5" fill="#FFFFFF"/>
    <!-- Printed Document Tray -->
    <rect x="14" y="30" width="24" height="12" rx="1" fill="#E8F8EC" stroke="#A7F3D0" stroke-width="0.8"/>
    <!-- Printed Lines -->
    <line x1="17" y1="34" x2="35" y2="34" stroke="#00B32D" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="17" y1="37" x2="29" y2="37" stroke="#00B32D" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Wordmark: Easy (Black) To (Green) Print (Black) -->
  <text x="76" y="44" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#111111">Easy</tspan><tspan fill="#00B32D">To</tspan><tspan fill="#111111">Print</tspan>
  </text>
</svg>
